<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror, Mirror — your pocket stylist</title>
<style>
:root{--ink:#241E28;--soft:#5C5262;--paper:#F4F2F5;--panel:#fff;--garnet:#8A2D44;--deep:#5E1D30;--gold:#A5824F;--line:#DFD9E2;--serif:Didot,"Bodoni MT","Playfair Display",Georgia,serif;--sans:"Avenir Next",Avenir,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0}body{min-height:100vh;background:var(--paper);color:var(--ink);font:15.5px/1.55 var(--sans)}.wrap{max-width:1040px;margin:auto;padding:0 22px}.nav{display:flex;align-items:center;gap:6px;padding:18px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.wordmark{font:italic 26px var(--serif);margin-right:auto;cursor:pointer;border:0;background:none;color:var(--ink)}.wordmark span{color:var(--garnet)}.navbtn,.method{border:1.5px solid var(--line);background:#fff;font:14.5px var(--sans);color:var(--soft);padding:8px 13px;border-radius:999px;cursor:pointer}.navbtn{border:0;background:none}.navbtn.on,.method.on{background:var(--ink);color:#fff;border-color:var(--ink)}button:focus-visible{outline:2px solid var(--garnet);outline-offset:2px}h1,h2,h3{font-family:var(--serif);font-weight:500}h1{font-size:clamp(38px,6vw,64px);line-height:1.04}h2{font-size:clamp(28px,4vw,40px);line-height:1.1;margin-bottom:10px}h3{font-size:22px}.lede{color:var(--soft);max-width:58ch}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;padding:56px 0 40px}.fan{position:relative;height:300px}.fcard{position:absolute;left:50%;bottom:8px;width:86px;height:230px;border-radius:14px 14px 46px 46px;transform-origin:50% 96%;box-shadow:0 10px 24px #241e2830;border:3px solid #fff}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.methods{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.eyebrow{font:italic 17px var(--serif);color:var(--garnet);margin-bottom:4px}.btn{border:0;cursor:pointer;font:15px var(--sans);padding:12px 22px;border-radius:999px;background:var(--garnet);color:#fff}.btn:hover{background:var(--deep)}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}.btn.small{padding:8px 16px;font-size:13.5px}.btn:disabled{opacity:.45;cursor:default}.uploader{border:2px dashed var(--line);border-radius:16px;padding:30px;text-align:center;background:#fff;cursor:pointer}.uploader:hover{border-color:var(--gold)}.note{font-size:13px;color:var(--soft)}.placer-canvas{touch-action:none;border-radius:16px;background:#241E28;max-width:100%;display:block;cursor:grab}.placer-canvas:active{cursor:grabbing}.zoomrow{display:flex;align-items:center;gap:12px;margin:12px 0}.zoomrow input{flex:1;accent-color:var(--garnet)}.face{width:230px;height:230px;border-radius:50%;object-fit:cover;border:6px solid #fffffff0;box-shadow:0 14px 30px #00000040}.face.mini{width:84px;height:84px;border-width:3px}.faceph{width:230px;height:230px;border-radius:50%;background:#E8E2EA;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:13px;text-align:center;padding:20px}.drapewrap{border-radius:20px;padding:44px 20px;display:flex;justify-content:center;transition:background .35s}.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.sw{width:44px;height:44px;border-radius:10px;border:2px solid #fff;box-shadow:0 1px 4px #00000026;padding:0}.sw.big{width:56px;height:56px}.swbtn{cursor:pointer}.swbtn.on{outline:3px solid var(--ink)}.dialstage{position:relative;display:flex;justify-content:center;padding:8px 0 4px}.dial{width:min(460px,88vw);background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center;touch-action:pan-y;user-select:none}.dial svg{width:100%;display:block}.dialarrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;padding:0;font-size:18px}.prev{left:0}.next{right:0}.dialpills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}.dialpills .method{padding:7px 13px;font-size:13px}.footer{padding:34px 0 44px;color:var(--soft);font-size:13px;border-top:1px solid var(--line);margin-top:50px}@media(max-width:820px){.hero,.grid2,.grid3{grid-template-columns:1fr}.hero{padding:36px 0}}@media(max-width:560px){.prev{left:-8px}.next{right:-8px}}
</style>
</head>
<body><div class="wrap"><nav class="nav" id="nav"></nav><main id="main" style="padding-top:30px"></main><footer class="footer">Runs entirely on this device — no internet needed. Nothing is uploaded and photos never leave your browser. Color analysis is an interpretive framework, not a rulebook.</footer></div>
<script>
const SEASONS={
brightWinter:{name:'Bright Winter',traits:['cool-neutral','high contrast','clear, brilliant'],palette:['#F7F7F2','#00A3E0','#D20A3A','#5B2A86','#00A878','#111827','#F3C623','#FFFFFF']},trueWinter:{name:'True Winter',traits:['fully cool','high contrast','clear, deep'],palette:['#FFFFFF','#0057B8','#B0003A','#4B0082','#008B8B','#111111','#C0C0C0','#E6E6FA']},darkWinter:{name:'Dark Winter',traits:['cool-neutral','deep','rich, clear'],palette:['#E8DCC8','#16324F','#5C1028','#24104F','#064E40','#141414','#A67C00','#9B1B30']},brightSpring:{name:'Bright Spring',traits:['warm-neutral','high contrast','hot, clear'],palette:['#FFF4D6','#00A6A6','#F04438','#8E2DE2','#7CB342','#273043','#FFB000','#FF6F61']},trueSpring:{name:'True Spring',traits:['fully warm','medium contrast','sunlit'],palette:['#FFF1C1','#009B77','#F05A28','#F4A300','#E83F6F','#6B3E26','#8DB600','#FFFFFF']},lightSpring:{name:'Light Spring',traits:['warm-neutral','low contrast','fresh'],palette:['#FFF6DD','#8ED1C5','#FFB7A5','#F5C6E7','#B7D96C','#A9C7D9','#FFD166','#FFFDF5']},lightSummer:{name:'Light Summer',traits:['cool-neutral','low contrast','airy'],palette:['#F5F1EA','#9BB7D4','#D9A6B2','#A8C8C0','#C8B6D9','#7189A8','#E3C878','#FFFFFF']},trueSummer:{name:'True Summer',traits:['fully cool','medium contrast','softened'],palette:['#F3F0EA','#4776A8','#B76E8A','#7067A0','#5B8C85','#46505A','#C7A76C','#E7E4F1']},softSummer:{name:'Soft Summer',traits:['cool-neutral','low-medium contrast','muted'],palette:['#D9D3C7','#6F899D','#A87988','#827B9B','#799A91','#606875','#B2A17A','#C6C1CD']},softAutumn:{name:'Soft Autumn',traits:['warm-neutral','low-medium contrast','earthy'],palette:['#E8D9BD','#6F8F72','#B66B5C','#9A7B4F','#8C7A5B','#635449','#C9A24B','#D5BFA3']},trueAutumn:{name:'True Autumn',traits:['fully warm','medium contrast','golden'],palette:['#F1D3A2','#B44A2A','#C88719','#7B4B2A','#6B7D2A','#5A2E22','#D39B2A','#E7A977']},darkAutumn:{name:'Dark Autumn',traits:['warm-neutral','deep','smoldering'],palette:['#D9C19A','#7A2E1E','#8A5A00','#3F2A56','#3E5B35','#241B18','#A66A00','#922B3E']}};
const DRAPES=[['Warm vs cool metals',[['#C9A24B','Gold'],['#C0C6CE','Silver']],'Which metal makes skin look even and lit from within?'],['Warm red vs cool red',[['#B7472A','Tomato'],['#B04A6E','Raspberry']],'The right red makes lips and cheeks look naturally rosier.'],['Cream vs pure white',[['#F3E4C8','Cream'],['#FFFFFF','Optic white']],'One will blend and glow; the other will sharpen or turn you grey.'],['Salmon vs cool pink',[['#FF8D6D','Salmon'],['#F3B3C9','Rose pink']],'Watch the under-eye area for shadows and brightness.'],['Bright vs muted',[['#00A3E0','Clear azure'],['#7A93AC','Dusty blue']],'Does the bright color wake your face up or wear you?'],['Light vs deep',[['#D5DDE0','Mist'],['#1B1B1E','Ink']],'Does depth frame your features or look like a hole in the photo?']];
const S={page:'home',tab:'photo',faceUrl:null,drape:'#B04A6E',dial:0};let srcImg=null,view={x:0,y:0,scale:1},dragging=null;const OV={cx:180,cy:210,rx:120,ry:155,W:360,H:440},$=id=>document.getElementById(id);
function go(p){S.page=p;render();scrollTo(0,0)}function tab(t){S.tab=t;render()}function swatches(a,big=false){return `<div class="swatches">${a.map(c=>`<span class="sw${big?' big':''}" style="background:${c}" title="${c}"></span>`).join('')}</div>`}function file(){ $('file').click() }
function onFile(e){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{srcImg=im;fit();S.faceUrl=null;S.tab='photo';render()};im.src=r.result};r.readAsDataURL(f)}function fit(){const scale=Math.max(OV.W/srcImg.width,OV.H/srcImg.height)*1.05;view={scale,x:(OV.W-srcImg.width*scale)/2,y:(OV.H-srcImg.height*scale)/2}}
function draw(){const c=$('placer');if(!c||!srcImg)return;const x=c.getContext('2d');x.clearRect(0,0,OV.W,OV.H);x.drawImage(srcImg,view.x,view.y,srcImg.width*view.scale,srcImg.height*view.scale);x.save();x.beginPath();x.rect(0,0,OV.W,OV.H);x.ellipse(OV.cx,OV.cy,OV.rx,OV.ry,0,0,Math.PI*2,true);x.fillStyle='#241e288c';x.fill('evenodd');x.restore();x.save();x.setLineDash([7,7]);x.strokeStyle='#ffffffe8';x.lineWidth=2.5;x.beginPath();x.ellipse(OV.cx,OV.cy,OV.rx,OV.ry,0,0,Math.PI*2);x.stroke();x.restore()}
function setup(){const c=$('placer');if(!c)return;draw();c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);dragging={x:e.clientX,y:e.clientY}};c.onpointermove=e=>{if(!dragging)return;const k=c.width/c.getBoundingClientRect().width;view.x+=(e.clientX-dragging.x)*k;view.y+=(e.clientY-dragging.y)*k;dragging={x:e.clientX,y:e.clientY};draw()};c.onpointerup=c.onpointercancel=()=>dragging=null;c.onwheel=e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0015))};$('zoom').oninput=e=>zoom(parseFloat(e.target.value)/view.scale)}function zoom(f){view.x=OV.cx-(OV.cx-view.x)*f;view.y=OV.cy-(OV.cy-view.y)*f;view.scale*=f;draw();$('zoom').value=view.scale}
function setFace(){if(!srcImg)return;const out=document.createElement('canvas');out.width=out.height=300;const o=out.getContext('2d'),k=150/152;o.beginPath();o.arc(150,150,150,0,Math.PI*2);o.clip();o.translate(150-OV.cx*k,150-(OV.cy-8)*k);o.scale(k,k);o.drawImage(srcImg,view.x,view.y,srcImg.width*view.scale,srcImg.height*view.scale);S.faceUrl=out.toDataURL('image/jpeg',.9);render()}
function dialSVG(id){const s=SEASONS[id],n=s.palette.length,cx=175,cy=175,r1=116,r2=172,g=2.5;let rays='';for(let i=0;i<n;i++){const a=((i*360/n)-90+g)*Math.PI/180,b=(((i+1)*360/n)-90-g)*Math.PI/180,P=(r,t)=>`${(cx+r*Math.cos(t)).toFixed(1)} ${(cy+r*Math.sin(t)).toFixed(1)}`;rays+=`<path d="M${P(r1,a)}L${P(r2,a)}A${r2} ${r2} 0 0 1 ${P(r2,b)}L${P(r1,b)}A${r1} ${r1} 0 0 0 ${P(r1,a)}Z" fill="${s.palette[i]}"/>`}const face=S.faceUrl?`<clipPath id="f${id}"><circle cx="175" cy="175" r="108"/></clipPath><image href="${S.faceUrl}" x="67" y="67" width="216" height="216" clip-path="url(#f${id})"/>`:`<circle cx="175" cy="175" r="108" fill="#E8E2EA"/><text x="175" y="175" text-anchor="middle" fill="#5C5262" font-size="12">Add a photo</text>`;return `<svg viewBox="0 0 350 350" role="img" aria-label="${s.name} palette around your face">${rays}<circle cx="175" cy="175" r="112" fill="#fff"/>${face}</svg>`}
function dial(){const ids=Object.keys(SEASONS),id=ids[S.dial],s=SEASONS[id];return `<div class="dialstage"><button class="btn ghost dialarrow prev" onclick="step(-1)">←</button><div class="dial" id="dialbox"><h3>${s.name}</h3><p class="note">${s.traits.join(' · ')}</p>${dialSVG(id)}</div><button class="btn ghost dialarrow next" onclick="step(1)">→</button></div><div class="dialpills">${ids.map((x,i)=>`<button class="method${i===S.dial?' on':''}" onclick="jump(${i})">${SEASONS[x].name}</button>`).join('')}</div>`}function step(n){S.dial=(S.dial+n+12)%12;render()}function jump(n){S.dial=n;render()}
function renderColor(){let body='';if(S.tab==='photo')body=srcImg?`<div class="grid2"><div><canvas id="placer" width="360" height="440" class="placer-canvas"></canvas><div class="zoomrow"><span class="note">Zoom</span><input id="zoom" type="range" min=".2" max="6" step=".01" value="${view.scale}"></div><button class="btn" onclick="setFace()">Set my face</button><button class="btn ghost small" onclick="file()">Different photo</button><p class="note" style="margin-top:10px">Drag and zoom until your face fills the oval.</p></div><div class="panel"><h3>${S.faceUrl?'Face set':'Place your face'}</h3>${S.faceUrl?`<img class="face" src="${S.faceUrl}" alt="Your placed face"><p class="note">Your face will appear at the center of every palette dial and drape.</p>`:'<p>Use natural daylight and judge colors with your own eye.</p>'}</div></div>`:`<div class="uploader" onclick="file()"><h3>Add a photo of your face</h3><p class="note">Natural daylight, no makeup or filters. The photo never leaves this device.</p><span class="btn small" style="margin-top:12px">Choose photo</span></div>`;if(S.tab==='dials')body=dial();if(S.tab==='drape')body=`<div class="grid2"><div><div class="drapewrap" id="drapebox" style="background:${S.drape}">${S.faceUrl?`<img class="face" src="${S.faceUrl}" alt="Your face on a drape color">`:'<div class="faceph">Set a photo in the Photo tab to drape it</div>'}</div><div class="swatches">${Object.values(SEASONS).flatMap(s=>s.palette).slice(0,32).map(c=>`<button class="sw swbtn${S.drape===c?' on':''}" style="background:${c}" onclick="drape('${c}')" aria-label="Drape ${c}"></button>`).join('')}</div></div><div><h3>Compare colors</h3><p class="note" style="margin:8px 0 14px">Tap both colors in each pair. Watch your skin, eyes and under-eye shadows rather than the swatch.</p>${DRAPES.map(d=>`<div style="margin-bottom:15px"><strong>${d[0]}</strong><div style="display:flex;gap:8px;margin:6px 0">${d[1].map(x=>`<button class="btn ghost small" onclick="drape('${x[0]}')"><span class="sw" style="background:${x[0]};width:22px;height:22px;border-radius:6px;display:inline-block;vertical-align:middle"></span> ${x[1]}</button>`).join('')}</div><p class="note">${d[2]}</p></div>`).join('')}</div></div>`;return `<p class="eyebrow">Color tools</p><h2>See yourself in color</h2><p class="lede">Upload one photo, place your face, then compare palettes and drapes. Warm and cool metals, reds, whites, pinks, blues, and light versus deep colors all stay in the mirror.</p><div class="methods">${[['photo','Your photo'],['dials','Color dials'],['drape','Draping']].map(x=>`<button class="method${S.tab===x[0]?' on':''}" onclick="tab('${x[0]}')">${x[1]}</button>`).join('')}</div>${body}`}
function drape(c){S.drape=c;const d=$('drapebox');if(d)d.style.background=c;document.querySelectorAll('.swbtn').forEach(x=>x.classList.toggle('on',x.style.background===c||x.style.background===c.toLowerCase()))}function renderHome(){const fans=Object.values(SEASONS).map(s=>s.palette);return `<div class="hero"><div><h1>Dress in colors that make you glow.</h1><p class="lede" style="margin:16px 0 24px">A private, offline color mirror for exploring palettes with your own face and your own eye.</p><button class="btn" onclick="go('color')">Open the color mirror</button></div><div class="fan" aria-hidden="true">${fans.map((p,i)=>`<div class="fcard" style="transform:translateX(-50%) rotate(${(i-5.5)*9}deg);background:linear-gradient(180deg,${p[2]},${p[3]},${p[0]},${p[4]});z-index:${i}"></div>`).join('')}</div></div><div class="grid3"><div class="panel"><h3>Your photo</h3><p class="note">Place your face once in a private on-device mirror.</p></div><div class="panel"><h3>Color dials</h3><p class="note">Explore all twelve seasonal palettes around your face.</p></div><div class="panel"><h3>Draping</h3><p class="note">Compare gold and silver, warm and cool, bright and muted, and more.</p></div></div>`}
function render(){const nav=[['home','Home'],['color','Color mirror']];$('nav').innerHTML=`<button class="wordmark" onclick="go('home')">Mirror, <span>Mirror</span></button>${nav.map(x=>`<button class="navbtn${S.page===x[0]?' on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}`;$('main').innerHTML=(S.page==='home'?renderHome():renderColor())+`<input id="file" type="file" accept="image/*" style="display:none">`;$('file').onchange=onFile;if(S.tab==='photo'&&srcImg)setup()}render();
</script></body></html>
