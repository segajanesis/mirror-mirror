<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror, Mirror — your pocket stylist</title>
<style>
:root{
  --ink:#241E28; --ink-soft:#5C5262; --paper:#F4F2F5; --panel:#FFFFFF;
  --garnet:#8A2D44; --garnet-deep:#5E1D30; --gold:#A5824F; --line:#DFD9E2;
  --serif: Didot, "Bodoni MT", "Playfair Display", "Cormorant Garamond", Georgia, serif;
  --sans: "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box; margin:0}
body{min-height:100vh; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15.5px; line-height:1.55;}
.wrap{max-width:1040px; margin:0 auto; padding:0 22px}
.nav{display:flex; align-items:center; gap:6px; padding:18px 0 14px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.wordmark{font-family:var(--serif); font-style:italic; font-size:26px; margin-right:auto; cursor:pointer; border:none; background:none; color:var(--ink)}
.wordmark span{color:var(--garnet)}
.navbtn{border:none; background:none; font-family:var(--sans); font-size:14.5px; color:var(--ink-soft); padding:8px 12px; border-radius:999px; cursor:pointer}
.navbtn:hover{color:var(--ink)}
.navbtn.on{background:var(--ink); color:#fff}
button:focus-visible{outline:2px solid var(--garnet); outline-offset:2px}
h1.display{font-family:var(--serif); font-weight:500; font-size:clamp(38px,6vw,64px); line-height:1.04; letter-spacing:-.01em}
h2.display{font-family:var(--serif); font-weight:500; font-size:clamp(26px,3.6vw,36px); line-height:1.12; margin-bottom:10px}
h3.display{font-family:var(--serif); font-weight:600; font-size:21px; margin-bottom:6px}
.lede{color:var(--ink-soft); max-width:56ch}
.hero{display:grid; grid-template-columns:1.15fr .85fr; gap:36px; align-items:center; padding:56px 0 40px}
@media(max-width:820px){.hero{grid-template-columns:1fr; padding:36px 0}}
.fan{position:relative; height:300px}
.fan .fcard{position:absolute; left:50%; bottom:8px; width:86px; height:230px; border-radius:14px 14px 46px 46px; transform-origin:50% 96%; box-shadow:0 10px 24px rgba(36,30,40,.18); border:3px solid #fff}
.btn{display:inline-block; border:none; cursor:pointer; font-family:var(--sans); font-size:15px; padding:12px 22px; border-radius:999px; background:var(--garnet); color:#fff}
.btn:hover{background:var(--garnet-deep)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink); color:#fff}
.btn.small{padding:8px 16px; font-size:13.5px}
.btn:disabled{opacity:.45; cursor:default}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.eyebrow{font-family:var(--serif); font-style:italic; color:var(--garnet); font-size:17px; margin-bottom:4px}
.methods{display:flex; gap:8px; margin:18px 0; flex-wrap:wrap}
.method{border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:10px 16px; cursor:pointer; font-size:14.5px; color:var(--ink-soft); font-family:var(--sans)}
.method.on{border-color:var(--ink); color:var(--ink); font-weight:600}
.opt{display:block; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:12px 16px; margin:8px 0; cursor:pointer; font-size:15px; color:var(--ink); font-family:var(--sans)}
.opt:hover{border-color:var(--gold)}
.opt.picked{border-color:var(--garnet); background:#FBF3F5}
.qnum{font-family:var(--serif); font-style:italic; color:var(--gold); margin-bottom:2px}
.swatches{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0}
.sw{width:44px; height:44px; border-radius:10px; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.15); padding:0}
.sw.big{width:56px; height:56px}
.swbtn{cursor:pointer}
.swbtn.on{outline:3px solid var(--ink)}
.drapewrap{border-radius:20px; padding:44px 20px; display:flex; justify-content:center; transition:background .35s}
.face{width:230px; height:230px; border-radius:50%; object-fit:cover; border:6px solid rgba(255,255,255,.85); box-shadow:0 14px 30px rgba(0,0,0,.25)}
.face.mini{width:84px; height:84px; border-width:3px}
.faceph{width:230px; height:230px; border-radius:50%; background:#E8E2EA; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:13px; text-align:center; padding:20px}
.tag{display:inline-block; font-size:12.5px; border:1px solid var(--line); border-radius:999px; padding:3px 11px; margin:0 6px 6px 0; color:var(--ink-soft); background:#fff}
.divider{border:none; border-top:1px solid var(--line); margin:26px 0}
.result-hero{border-radius:20px; padding:34px 30px; color:#fff}
.bar{height:10px; border-radius:999px; background:var(--line); overflow:hidden; margin:6px 0 2px}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--garnet))}
.celeb{font-family:var(--serif); font-size:18px}
.uploader{border:2px dashed var(--line); border-radius:16px; padding:30px; text-align:center; background:#fff; cursor:pointer}
.uploader:hover{border-color:var(--gold)}
.note{font-size:13px; color:var(--ink-soft)}
.two-col{columns:2; column-gap:26px}
@media(max-width:700px){.two-col{columns:1}}
.footer{padding:34px 0 44px; color:var(--ink-soft); font-size:13px; border-top:1px solid var(--line); margin-top:50px}
.placer-canvas{touch-action:none; border-radius:16px; background:#241E28; max-width:100%; display:block; cursor:grab}
.placer-canvas:active{cursor:grabbing}
.zoomrow{display:flex; align-items:center; gap:12px; margin:12px 0}
.zoomrow input[type=range]{flex:1; accent-color:var(--garnet)}
.dialstage{position:relative; display:flex; justify-content:center; padding:8px 0 4px}
.dial{width:min(460px,88vw); background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:18px; text-align:center; touch-action:pan-y; user-select:none}
.dial svg{width:100%; height:auto; display:block}
.dialarrow{position:absolute; top:50%; transform:translateY(-50%); z-index:2; width:44px; height:44px; border-radius:50%; padding:0; font-size:18px}
.dialarrow.prev{left:0}
.dialarrow.next{right:0}
@media(max-width:560px){.dialarrow.prev{left:-8px}.dialarrow.next{right:-8px}}
.dialpills{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:14px}
.dialpills .method{padding:7px 13px; font-size:13px}
.readout{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:10px 0; font-size:14.5px}
.readout b{font-family:var(--serif); font-style:italic; font-weight:500; color:var(--garnet)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; scroll-behavior:auto !important} }
</style>
</head>

lightSummer:{name:"Light Summer",family:"Summer",vec:{w:-0.6,v:-1,c:-0.1},traits:["cool-neutral undertone","low contrast","light, airy color"],blurb:"Sea mist and hydrangeas. Your palette lives in soft, cool light: powder blue, rose, lavender. Deep saturated color creates a hard edge your features never asked for.",palette:["#AFC9E1","#F3B3C9","#C9B7D9","#BFE0D5","#D5DDE0","#DE7C9C","#8AA9C9","#F6F7F9","#A8A2C0","#6B7C93"],avoid:["#D8712A","#B7472A","#101820","#B5892A"],avoidNote:"hot oranges, black and mustard are far too heavy and warm",celebs:["Margot Robbie","Dakota Fanning","Naomi Watts"],tips:"Soft white and grey-blue replace stark black and white. Rose over red. Brushed silver and rose gold jewelry."},

softAutumn:{name:"Soft Autumn",family:"Autumn",vec:{w:0.4,v:0.2,c:-1},traits:["warm-neutral undertone","low-medium contrast","muted, earthy color"],blurb:"Late-August fields. Warmth turned down to a hum — your best colors are sun-faded: sage, salmon, camel, muted teal. Clear jewel tones look borrowed on you; softened earth looks born on you.",palette:["#9C9A62","#D9977F","#C1A278","#7E7A46","#A99A86","#5E8E8B","#C57F63","#8A5A44","#F1E7D6","#6B4F3A"],avoid:["#0047BB","#C724B1","#FFFFFF","#101820"],avoidNote:"cool brights, optic white and black are too sharp",celebs:["Gigi Hadid","Drew Barrymore","Sofia Richie"],tips:"Mushroom, camel and olive are your black. Terracotta blush, brick-rose lips. Matte textures over shine, brushed gold jewelry."},

function onFile(e){
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image(); im.onload=()=>{srcImg=im; fitImage(); S.faceUrl=null; S.ctab="photo"; render();}; im.src=r.result;};
  r.readAsDataURL(f);
}
function fitImage(){
  const s=Math.max(OV.W/srcImg.width, OV.H/srcImg.height)*1.05;
  view={scale:s, x:(OV.W-srcImg.width*s)/2, y:(OV.H-srcImg.height*s)/2};
}
function setupPlacer(){
  const cv=$("placer"); if(!cv)return;
  drawPlacer();
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId); dragging={x:e.clientX,y:e.clientY};};
  cv.onpointermove=e=>{if(!dragging)return; const k=cv.width/cv.getBoundingClientRect().width;
    view.x+=(e.clientX-dragging.x)*k; view.y+=(e.clientY-dragging.y)*k; dragging={x:e.clientX,y:e.clientY}; drawPlacer();};
  cv.onpointerup=cv.onpointercancel=()=>{dragging=null;};
  cv.onwheel=e=>{e.preventDefault(); zoomAt(Math.exp(-e.deltaY*0.0015));};
  const z=$("zoom"); if(z){z.oninput=()=>{const target=parseFloat(z.value); zoomTo(target);};}
}
function zoomAt(f){const cx=OV.cx,cy=OV.cy; view.x=cx-(cx-view.x)*f; view.y=cy-(cy-view.y)*f; view.scale*=f; drawPlacer(); const z=$("zoom"); if(z)z.value=view.scale;}
function zoomTo(t){zoomAt(t/view.scale);}
function drawPlacer(){
  const cv=$("placer"); if(!cv||!srcImg)return;
  const x=cv.getContext("2d");
  x.clearRect(0,0,OV.W,OV.H);
  x.drawImage(srcImg,view.x,view.y,srcImg.width*view.scale,srcImg.height*view.scale);
  x.save(); x.beginPath(); x.rect(0,0,OV.W,OV.H); x.ellipse(OV.cx,OV.cy,OV.rx,OV.ry,0,0,Math.PI*2,true);
  x.fillStyle="rgba(36,30,40,.55)"; x.fill("evenodd"); x.restore();
  x.save(); x.setLineDash([7,7]); x.strokeStyle="rgba(255,255,255,.9)"; x.lineWidth=2.5;
  x.beginPath(); x.ellipse(OV.cx,OV.cy,OV.rx,OV.ry,0,0,Math.PI*2); x.stroke(); x.restore();
}
function setFace(){
  if(!srcImg)return;
  const R=152, out=document.createElement("canvas"); out.width=out.height=300;
  const o=out.getContext("2d"), k=150/R;
  o.beginPath(); o.arc(150,150,150,0,Math.PI*2); o.clip();
  o.translate(150-(OV.cx)*k,150-(OV.cy-8)*k); o.scale(k,k);
  o.drawImage(srcImg,view.x,view.y,srcImg.width*view.scale,srcImg.height*view.scale);
  S.faceUrl=out.toDataURL("image/jpeg",0.9);
  render();
}

function dialSVG(id){
  const s=SEASONS[id], n=s.palette.length, cx=175, cy=175, r1=116, r2=172, gap=2.5;
  let rays="";
  for(let i=0;i<n;i++){
    const a0=((i*360/n)-90+gap)*Math.PI/180, a1=(((i+1)*360/n)-90-gap)*Math.PI/180;
    const P=(r,a)=>`${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)}`;
    rays+=`<path d="M ${P(r1,a0)} L ${P(r2,a0)} A ${r2} ${r2} 0 0 1 ${P(r2,a1)} L ${P(r1,a1)} A ${r1} ${r1} 0 0 0 ${P(r1,a0)} Z" fill="${s.palette[i]}"/>`;
  }
  const face=S.faceUrl
    ?`<clipPath id="fc-${id}"><circle cx="${cx}" cy="${cy}" r="108"/></clipPath><image href="${S.faceUrl}" x="${cx-108}" y="${cy-108}" width="216" height="216" clip-path="url(#fc-${id})" preserveAspectRatio="xMidYMid slice"/>`
    :`<circle cx="${cx}" cy="${cy}" r="108" fill="#E8E2EA"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#5C5262" font-family="sans-serif">Add a photo to</text><text x="${cx}" y="${cy+16}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#5C5262" font-family="sans-serif">see yourself here</text>`;
  return `<svg viewBox="0 0 350 350" role="img" aria-label="${s.name} colors around your face">${rays}<circle cx="${cx}" cy="${cy}" r="112" fill="#fff"/>${face}</svg>`;
}
function dialInner(id){
  const x=SEASONS[id];
  return `<h3 class="display" style="margin-bottom:2px">${x.name}</h3>
    <p class="note" style="margin-bottom:8px">${x.traits.join(" · ")}</p>
    ${dialSVG(id)}
    <div style="margin-top:10px"><button class="btn ghost small" onclick="claimSeason('${id}')">This is my season</button></div>`;
}
function dialStep(d){
  const n=Object.keys(SEASONS).length;
  S.dialIndex=(S.dialIndex+d+n)%n; updateDial();
}
function dialJump(i){S.dialIndex=i; updateDial();}
function updateDial(){
  const box=$("dialbox"); if(!box)return;
  box.innerHTML=dialInner(Object.keys(SEASONS)[S.dialIndex]);
  document.querySelectorAll(".dialpill").forEach((b,i)=>b.classList.toggle("on",i===S.dialIndex));
}
function setupDials(){
  const box=$("dialbox"); if(!box)return;
  let sx=null;
  box.onpointerdown=e=>{sx=e.clientX;};
  box.onpointerup=e=>{if(sx!==null){const dx=e.clientX-sx; if(Math.abs(dx)>45)dialStep(dx<0?1:-1); sx=null;}};
  document.onkeydown=e=>{
    if(S.page!=="color"||S.ctab!=="dials")return;
    if(e.key==="ArrowRight")dialStep(1);
    if(e.key==="ArrowLeft")dialStep(-1);
  };
}

function quizSeason(){
  const v={w:0,v:0,c:0};
  Object.entries(S.cq).forEach(([qi,oi])=>{const fx=CQ[qi].o[oi].fx; v.w+=fx.w||0; v.v+=fx.v||0; v.c+=fx.c||0;});

  let best=null,bd=1e9;
  for(const [id,x] of Object.entries(SEASONS)){const d=(x.vec.w-norm.w)**2+(x.vec.v-norm.v)**2+(x.vec.c-norm.c)**2; if(d<bd){bd=d;best=id;}}
  S.seasonId=best; render();
}
function kibbeFromCounts(c){
  const total=c.a+c.b+c.c+c.d+c.e, yang=c.a+c.b, yin=c.d+c.e, pct=n=>n/total;
  const max=Math.max(c.a,c.b,c.c,c.d,c.e);
  if(c.c===max&&pct(c.c)>=0.32)return yang>=yin?"DC":"SC";
  if(c.a===max)return pct(c.e+c.d)>=0.28?"SD":"D";
  if(c.b===max)return pct(c.d+c.e)>=0.28?"SN":"FN";
  if(c.d===max)return yang>=yin-c.d?(c.e>c.a+c.b?"SG":"FG"):"SG";
  if(c.e===max)return pct(c.a+c.b)>=0.22?"TR":"R";
  return yang>yin?"DC":"SC";
}
function heightGate(base){
  // Kibbe's height rules: petite-frame types (Gamines, Romantic, TR) cap around 5'5";
  // above that, yin expresses through vertical line. Very petite frames rarely carry pure long-line types.
  if(S.kh===3) return {R:"SD",TR:"SD",SG:"SN",FG:"FN",SC:"SN",DC:"D"}[base]||base;      // 5'8"+
  if(S.kh===2) return {R:"SD",TR:"SD",SG:"SN",FG:"FN"}[base]||base;                     // 5'5"–5'7"
  if(S.kh===0) return {D:"FG",SD:"TR",FN:"SN"}[base]||base;                             // under 5'2"
  return base;                                                                          // 5'2"–5'4"
}
function revealKibbe(){
  const c={a:0,b:0,c:0,d:0,e:0};
  Object.values(S.kq).forEach(i=>c["abcde"[i]]++);
  const base=kibbeFromCounts(c);
  const final=heightGate(base);
  S.kibbeNote = final!==base
    ? `Your feature answers alone lean ${KIBBE[base].name} — but in the Kibbe system, height is part of your line. At ${HEIGHTS[S.kh].split(" (")[0]}, that same yin–yang mix expresses as ${KIBBE[final].name}.`
    : null;
  S.kibbeId=final; render();
}
function renderKibbe(){
  const answered=Object.keys(S.kq).length+(S.kh!==null?1:0), totalQ=KQ.length+1;
  const done=S.kh!==null&&Object.keys(S.kq).length===KQ.length;
  const n=Math.max(1,Object.keys(S.kq).length);
  const c={a:0,b:0,c:0,d:0,e:0}; Object.values(S.kq).forEach(i=>c["abcde"[i]]++);
  const yang=(c.a+c.b)/n, yin=(c.d+c.e)/n, k=S.kibbeId?KIBBE[S.kibbeId]:null;
  let lastCat=null;
  return `<p class="eyebrow">Step two</p><h2 class="display">Find your silhouette type</h2>
  <p class="lede">Kibbe body typing reads your bone structure, flesh and facial features on a spectrum from yang (long, sharp, angular) to yin (soft, rounded, delicate) — then tells you which lines, fabrics and silhouettes echo what's already there. Height counts too: petite-frame types only exist below about 5'5", and length itself is yang. Answer honestly about your skeleton, not your weight; a mirror and a snug outfit help.</p>
  <div class="grid2" style="margin-top:18px;align-items:start">
    <div>
      <h3 class="display">Height</h3>
      <div style="margin-bottom:18px">
        <p class="qnum">1 of ${totalQ}</p><strong>How tall am I?</strong>
        ${HEIGHTS.map((o,i)=>`<button class="opt${S.kh===i?" picked":""}" onclick="answerKH(${i})">${o}</button>`).join("")}
        <p class="note" style="margin-top:4px">Height is a hard line in this system: below about 5'5" the petite types (Gamine, Romantic) open up; above it, the same softness expresses through vertical line instead.</p>
      </div>
      ${KQ.map((q,qi)=>{const show=q.cat!==lastCat; lastCat=q.cat;
        return `<div style="margin-bottom:18px">${show?`<h3 class="display" style="margin-top:${qi?18:0}px">${q.cat}</h3>`:""}
        <p class="qnum">${qi+2} of ${totalQ}</p><strong>${q.q}</strong>
        ${q.o.map((o,oi)=>`<button class="opt${S.kq[qi]===oi?" picked":""}" onclick="answerKQ(${qi},${oi})">${o}</button>`).join("")}</div>`;}).join("")}
      <button class="btn" ${done?"":"disabled"} onclick="revealKibbe()">Reveal my type</button>
    </div>
    <div style="position:sticky;top:14px">
      <div class="panel"><h3 class="display">Your yin–yang balance</h3>
        <p class="note">Yang — length, sharpness, blunt strength</p><div class="bar"><i style="width:${yang*100}%"></i></div>
        <p class="note" style="margin-top:10px">Yin — softness, roundness, delicacy</p><div class="bar"><i style="width:${yin*100}%"></i></div>
        <p class="note" style="margin-top:12px">${answered} of ${totalQ} answered</p></div>
      ${k?`<div class="panel" style="margin-top:14px"><p class="eyebrow">Your type</p><h3 class="display">${k.name}</h3>
        ${tags([k.balance,k.short])}
        ${S.kibbeNote?`<p class="note" style="margin:8px 0;color:var(--garnet)">${S.kibbeNote}</p>`:""}
        <p style="margin:10px 0">${k.blurb}</p>
        <strong style="font-size:14px">Your lines</strong>
        <ul style="padding:4px 0 8px 18px">${k.lines.map(l=>`<li style="margin-bottom:2px">${l}</li>`).join("")}</ul>
        <p style="margin-bottom:6px"><strong style="font-size:14px">Fabrics · </strong>${k.fabrics}</p>
        <p class="note"><strong>Skip: </strong>${k.avoid}</p></div>`:""}
    </div></div>`;
}
function renderDossier(){
  const s=S.seasonId?SEASONS[S.seasonId]:null, k=S.kibbeId?KIBBE[S.kibbeId]:null;
  if(!s&&!k)return `<div style="text-align:center;padding:60px 0">
    <h2 class="display">Your profile is waiting to be written</h2>
    <p class="lede" style="margin:10px auto 20px">Find your color season and silhouette type first — then this page becomes your personal style dossier.</p>
    <button class="btn" onclick="go('color')">Start with color</button></div>`;
  return `<div class="result-hero" style="background:${s?`linear-gradient(120deg, ${s.palette[0]}, ${s.palette[2]||s.palette[1]})`:"var(--ink)"}">
    <p style="font-family:var(--serif);font-style:italic;font-size:19px;opacity:.9">Your style dossier</p>
    <h1 class="display" style="font-size:clamp(30px,5vw,48px)">${s?s.name:"Season pending"}${k?" · "+k.name:""}</h1>
    ${S.faceUrl?`<img src="${S.faceUrl}" class="face mini" style="margin-top:10px" alt="You">`:""}</div>
  <div class="grid2" style="margin-top:18px">
    ${s?`<div class="panel"><p class="eyebrow">Your colors</p><h3 class="display">${s.name}</h3>
      <p style="margin-bottom:8px">${s.blurb}</p>${swatches(s.palette,true)}
      <p style="margin:8px 0 4px"><strong style="font-size:14px">Handle with care</strong></p>${swatches(s.avoid)}
      <p class="note">${s.avoidNote}.</p><p style="margin-top:8px">${s.tips}</p></div>`:""}
    ${k?`<div class="panel"><p class="eyebrow">Your lines</p><h3 class="display">${k.name}</h3>
      <p style="margin-bottom:8px">${k.blurb}</p>
      <ul style="padding:0 0 8px 18px">${k.lines.map(l=>`<li style="margin-bottom:3px">${l}</li>`).join("")}</ul>
      <p style="margin-bottom:6px"><strong style="font-size:14px">Fabrics · </strong>${k.fabrics}</p>
      <p class="note"><strong>Skip: </strong>${k.avoid}</p></div>`:""}
  </div>
  ${s&&k?`<div class="panel" style="margin-top:18px"><p class="eyebrow">Putting it together</p>
    <h3 class="display">Your season paints, your type sculpts</h3>
    <p>Shop silhouettes with ${k.name.toLowerCase()} lines — ${k.short} — then choose them only in your ${s.name} palette. When both align, clothes stop competing with you: the color makes your skin glow while the cut echoes your natural geometry. A quick test in the fitting room: does the color wake up your face, and does the shape follow your body's own lines without fighting them?</p></div>`:""}
  <div class="panel" style="margin-top:18px"><p class="eyebrow">Your celebrity mirrors</p>
    <h3 class="display">Style muses to study</h3>
    ${s?`<p class="celeb" style="margin-bottom:6px">Season kin — ${s.celebs.join(", ")}</p>`:""}
    ${k?`<p class="celeb">Silhouette kin — ${k.celebs.join(", ")}</p>`:""}
    <p class="note" style="margin-top:8px">Widely cited examples from the color and Kibbe communities — use their red-carpet hits and misses as a study guide, not a rulebook.</p></div>`;
}
function renderLibrary(){
  const t=S.gtab;
  return `<p class="eyebrow">The library</p><h2 class="display">Every season, every type</h2>
  <p class="lede">Browse the full system — or claim a season or type directly if you already know yours.</p>
  <div class="methods">${[["seasons","12 seasons"],["kibbe","10 Kibbe types"],["essence","7 essences"]].map(([kk,l])=>
    `<button class="method${t===kk?" on":""}" onclick="setGtab('${kk}')">${l}</button>`).join("")}</div>
  ${t==="seasons"?`<div class="grid2">${Object.keys(SEASONS).map(id=>seasonCard(id,true)).join("")}</div>`:""}
  ${t==="kibbe"?`<div class="grid2">${Object.entries(KIBBE).map(([id,k])=>
    `<div class="panel" style="padding:20px"><h3 class="display">${k.name}</h3>${tags([k.balance,k.short])}
     <p class="note" style="margin:8px 0">${k.blurb}</p>
     <p class="note" style="margin-bottom:10px"><strong>Muses: </strong>${k.celebs.join(", ")}</p>
     <button class="btn ghost small" onclick="claimKibbe('${id}')">This is my type</button></div>`).join("")}</div>`:""}
  ${t==="essence"?`<div class="panel"><p style="margin-bottom:14px;max-width:62ch">Essence is the flavor on top of your structure — the impression your face and energy give beyond bone and color. Most people carry a blend of two or three. Borrow from any essence in small doses to make an outfit feel more like you.</p>
    <div class="two-col">${ESSENCES.map(e=>`<p style="break-inside:avoid;margin-bottom:12px"><span style="font-family:var(--serif);font-size:19px">${e.name}. </span>${e.note}</p>`).join("")}</div></div>`:""}`;
}
function renderHome(){
  const fans=Object.values(SEASONS).map(s=>s.palette);
  return `<div class="hero"><div>
    <h1 class="display">Dress like you know exactly who you are.</h1>
    <p class="lede" style="margin:16px 0 24px">Your pocket stylist reads your coloring against the 12 seasons, maps your bone structure through the Kibbe system, and hands you the palette, lines, fabrics and celebrity mirrors that make everything you put on look intentional. Everything runs on this device — take it anywhere.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" onclick="go('color')">Find my season</button>
      <button class="btn ghost" onclick="go('kibbe')">Find my silhouette</button></div></div>
  <div class="fan" aria-hidden="true">${fans.map((p,i)=>{
    const angle=(i-(fans.length-1)/2)*9;
    return `<div class="fcard" style="transform:translateX(-50%) rotate(${angle}deg);background:linear-gradient(180deg, ${p[2]} 0%, ${p[3]} 34%, ${p[0]} 68%, ${p[4]} 100%);z-index:${i}"></div>`;}).join("")}</div></div>
  <div class="grid3">${[
    ["Color season","Place your face in the oval, then see yourself at the center of 12 radial sun dials — or use the draping mirror and the no-photo quiz.","color","Begin with color"],
    ["Silhouette &amp; yin–yang","Your height plus seventeen questions about bone, flesh, feature and how clothes actually fit reveal your Kibbe type and the lines your body already draws.","kibbe","Take the silhouette quiz"],
    ["Your dossier","Season and silhouette merge into one page: palette, fabrics, lines and celebrity mirrors.","dossier","Open my dossier"]
  ].map(([t,d,dest,cta])=>`<div class="panel"><h3 class="display">${t}</h3><p class="note" style="margin-bottom:12px">${d}</p>
    <button class="btn ghost small" onclick="go('${dest}')">${cta}</button></div>`).join("")}</div>`;
}

/* ———————— SHELL ———————— */
function render(){
  const navItems=[["home","Home"],["color","Color"],["kibbe","Silhouette"],["dossier","My dossier"],["library","Library"]];
  $("nav").innerHTML=`<button class="wordmark" onclick="go('home')">Mirror, <span>Mirror</span></button>`+
    navItems.map(([k,l])=>`<button class="navbtn${S.page===k?" on":""}" onclick="go('${k}')">${l}</button>`).join("");
  const m=$("main");
  m.innerHTML=(S.page==="home"?renderHome():S.page==="color"?renderColor():S.page==="kibbe"?renderKibbe()
    :S.page==="dossier"?renderDossier():renderLibrary())
    +`<input id="file" type="file" accept="image/*" style="display:none">`;
  $("file").onchange=onFile;
  if(S.page==="color"&&S.ctab==="photo")setupPlacer();
  if(S.page==="color"&&S.ctab==="dials")setupDials();
}
render();
</script>
</body>
</html>
